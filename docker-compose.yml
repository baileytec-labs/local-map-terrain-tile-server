# Docker Compose for gev-map-terrain-stack
#
# Services:
#   gev-imagery   — OpenStreetMap XYZ raster tiles (port 8080)
#   gev-terrain   — CTOD quantized-mesh terrain (port 5001)
#   gev-buildings — OGC 3D Tiles static server (port 5002)
#   gev-scheduler — Monthly cron job to refresh all services
#
# Usage:
#   docker compose up -d gev-imagery gev-terrain gev-buildings   # start services
#   docker compose run --rm gev-imagery import                    # import OSM data
#   docker compose down                                           # stop all services

services:
  gev-imagery:
    image: overv/openstreetmap-tile-server:latest
    container_name: gev-imagery
    command: ["run"]
    environment:
      - THREADS=4
    volumes:
      - ./data/imagery/pbf/${DEV_BBOX_NAME}.osm.pbf:/data/region.osm.pbf:ro
      - ./data/imagery/db:/data/database
      - ./data/imagery/tiles:/data/tiles
    ports:
      - "9876:80"
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g

  gev-terrain:
    image: ghcr.io/sogelink-research/ctod:latest
    container_name: gev-terrain
    environment:
      - CTOD_PORT=5000
      - CTOD_TILE_CACHE_PATH=/cache
      - CTOD_DATASET_CONFIG_PATH=/config/datasets.json
      - CTOD_LOGGING_LEVEL=info
      - CTOD_NO_DYNAMIC=true
    volumes:
      - ./terrain/datasets.json:/config/datasets.json:ro
      - ./data/terrain/mosaic.cog.tif:/data/mosaic.cog.tif:ro
      - ./data/terrain/cache:/cache
    ports:
      - "9877:5000"
    restart: unless-stopped

  gev-buildings:
    image: nginx:alpine
    container_name: gev-buildings
    volumes:
      - ./data/buildings/tileset:/usr/share/nginx/html:ro
      - ./buildings/nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9878:80"
    restart: unless-stopped

  gev-scheduler:
    build: ./scheduler
    container_name: gev-scheduler
    volumes:
      - ./:/stack:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
